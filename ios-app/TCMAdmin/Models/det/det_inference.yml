Global:
  model_name: PP-OCRv6_small_det
PreProcess:
  transform_ops:
  - DecodeImage:
      channel_first: false
      img_mode: BGR
  - DetResizeForTest:
      limit_side_len: 480
      limit_type: max
  - NormalizeImage:
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
      is_scale: true
  - ToCHWImage: null
  - KeepKeys:
      keep_keys:
      - image
      - shape
PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.7
  max_candidates: 50
  unclip_ratio: 1.5
