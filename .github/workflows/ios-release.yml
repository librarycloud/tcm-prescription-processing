name: iOS Release IPA

on:
  push:
    tags:
      - "v*"
      - "ios-v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "iOS Version Name (CFBundleShortVersionString)，例如 1.0.0"
        required: true
        type: string
        default: "1.0.0"
      version_code:
        description: "可选，iOS Build Number (CFBundleVersion) 整数（例如 100，不填则根据 versionName 自动换算）"
        required: false
        type: string
      bundle_id:
        description: "可选，Bundle Identifier（需与描述文件匹配，默认使用项目内置配置）"
        required: false
        type: string
      export_method:
        description: "IPA 导出方式 (ad-hoc / app-store / enterprise / development)"
        required: true
        type: choice
        options:
          - ad-hoc
          - app-store
          - development
          - enterprise
        default: ad-hoc
      release_tag:
        description: "可选，GitHub Release 标签，例如 v1.0.0；不填则使用 v+版本名称"
        required: false
        type: string

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    timeout-minutes: 45
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-app/TCMAdmin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve Version Information
        shell: bash
        run: |
          set -euo pipefail
          raw_version="${{ inputs.version_name }}"
          if [ -z "$raw_version" ]; then
            raw_tag="${GITHUB_REF_NAME:-}"
            raw_version="${raw_tag#ios-v}"
            raw_version="${raw_version#v}"
          fi
          if [ -z "$raw_version" ]; then
            echo "::error::无法解析有效的 version_name，请通过 workflow_dispatch 输入或推送 v* 格式 Tag。"
            exit 1
          fi

          raw_code="${{ inputs.version_code }}"
          if [ -z "$raw_code" ]; then
            cleaned_ver="$(echo "$raw_version" | tr -cd '0-9.')"
            IFS='.' read -r major minor patch rest <<< "${cleaned_ver}.0.0"
            major="${major:-0}"
            minor="${minor:-0}"
            patch="${patch:-0}"
            raw_code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          fi

          echo "IOS_VERSION_NAME=$raw_version" >> "$GITHUB_ENV"
          echo "IOS_VERSION_CODE=$raw_code" >> "$GITHUB_ENV"
          echo "=== 编译版本信息 ==="
          echo "Version Name: $raw_version"
          echo "Version Code: $raw_code"

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERT_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 || secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD || secrets.P12_PASSWORD }}
          BUILD_PROV_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 || secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$BUILD_CERT_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$BUILD_PROV_BASE64" ]; then
            echo "::error::缺少 iOS 签名证书或描述文件！请在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置以下密钥："
            echo "  - IOS_BUILD_CERTIFICATE_BASE64 (p12 证书文件的 Base64 编码)"
            echo "  - IOS_P12_PASSWORD (p12 证书导出密码)"
            echo "  - IOS_PROVISION_PROFILE_BASE64 (.mobileprovision 文件的 Base64 编码)"
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          PROV_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$BUILD_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$BUILD_PROV_BASE64" | base64 --decode > "$PROV_PATH"

          # 建立并解锁临时 Keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入 p12 证书
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 加入 Keychain 搜索路径
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # 安装 Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$PROV_PATH"))
          TEAM_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< $(security cms -D -i "$PROV_PATH") 2>/dev/null || echo "")
          cp "$PROV_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"

          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "IOS_PROV_UUID=$UUID" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=${TEAM_IDENTIFIER}" >> "$GITHUB_ENV"

          echo "✅ 证书与描述文件成功导入钥匙串 (Profile UUID: $UUID, Team ID: $TEAM_IDENTIFIER)"

      - name: Generate ExportOptions.plist
        env:
          EXPORT_METHOD: ${{ inputs.export_method || 'ad-hoc' }}
          PROV_UUID: ${{ env.IOS_PROV_UUID }}
          TEAM_ID: ${{ env.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build

          BUNDLE_ID="${{ inputs.bundle_id }}"
          if [ -z "$BUNDLE_ID" ]; then
            # 从描述文件中提取 Bundle ID 预设
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" /dev/stdin <<< $(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/"$PROV_UUID.mobileprovision") | sed "s/^$TEAM_ID\.//")
          fi
          echo "TARGET_BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROV_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF
          cat build/ExportOptions.plist

      - name: Build and Archive
        run: |
          set -euo pipefail
          mkdir -p build

          EXTRA_BUILD_SETTINGS=()
          EXTRA_BUILD_SETTINGS+=(MARKETING_VERSION="${{ env.IOS_VERSION_NAME }}")
          EXTRA_BUILD_SETTINGS+=(CURRENT_PROJECT_VERSION="${{ env.IOS_VERSION_CODE }}")
          if [ -n "${{ env.TARGET_BUNDLE_ID }}" ]; then
            EXTRA_BUILD_SETTINGS+=(PRODUCT_BUNDLE_IDENTIFIER="${{ env.TARGET_BUNDLE_ID }}")
          fi
          if [ -n "${{ env.IOS_TEAM_ID }}" ]; then
            EXTRA_BUILD_SETTINGS+=(DEVELOPMENT_TEAM="${{ env.IOS_TEAM_ID }}")
          fi

          xcodebuild archive \
            -project TCMAdmin.xcodeproj \
            -scheme MyApp \
            -configuration Release \
            -archivePath build/TCMAdmin.xcarchive \
            -destination "generic/platform=iOS" \
            "${EXTRA_BUILD_SETTINGS[@]}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ env.IOS_KEYCHAIN_PATH }}"

      - name: Export Release IPA
        run: |
          set -euo pipefail
          mkdir -p build/export

          xcodebuild -exportArchive \
            -archivePath build/TCMAdmin.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

          # 规范重命名为统一的 tcm-admin-release.ipa
          IPA_SRC="$(find build/export -name "*.ipa" | head -n 1)"
          if [ -z "$IPA_SRC" ]; then
            echo "::error::导出目录中未找到 .ipa 文件！"
            exit 1
          fi
          cp "$IPA_SRC" build/tcm-admin-release.ipa
          echo "✅ 成功生成 IPA 文件: build/tcm-admin-release.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcm-admin-release-ipa
          path: ios-app/TCMAdmin/build/tcm-admin-release.ipa
          retention-days: 30

      - name: Create Release Metadata
        shell: bash
        run: |
          set -euo pipefail
          version_code="${{ env.IOS_VERSION_CODE }}"
          version_name="${{ env.IOS_VERSION_NAME }}"
          ipa_file="build/tcm-admin-release.ipa"

          sha256="$(shasum -a 256 "$ipa_file" | awk '{print $1}')"
          size="$(stat -f '%z' "$ipa_file")"
          prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            notes_json="$(git log "${prev_tag}..HEAD" --pretty=format:'%s' | grep -v -E '^(Merge|chore\(release\))' | head -n 15 | jq -R . | jq -s .)"
          else
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            notes_json="$(git log -n 10 --pretty=format:'%s' | grep -v -E '^(Merge|chore\(release\))' | jq -R . | jq -s .)"
          fi
          test -n "$notes_json" || notes_json="[]"

          cat > build/app-version.ios.json <<EOF
          {
            "versionCode": $version_code,
            "versionName": "$version_name",
            "minVersionCode": 1,
            "forceUpdate": false,
            "releaseNotes": $notes_json,
            "changelogUrl": "$changelog_url",
            "publishedAt": "$(date -u +%F)",
            "ipaAsset": "tcm-admin-release.ipa",
            "sha256": "$sha256",
            "size": $size
          }
          EOF
          cat build/app-version.ios.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version_name) || github.ref_name) }}
          name: 药房助手 iOS ${{ inputs.release_tag || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version_name) || github.ref_name) }}
          generate_release_notes: true
          files: |
            ios-app/TCMAdmin/build/tcm-admin-release.ipa
            ios-app/TCMAdmin/build/app-version.ios.json

      - name: Notify App Release Hub
        if: success()
        env:
          VARS_RELEASE_HUB_URL: ${{ vars.RELEASE_HUB_URL || vars.UPDATE_BASE_URL }}
          SECRET_RELEASE_HUB_URL: ${{ secrets.RELEASE_HUB_URL || secrets.UPDATE_BASE_URL }}
          VARS_RELEASE_HUB_IOS_APP_ID: ${{ vars.RELEASE_HUB_IOS_APP_ID || vars.UPDATE_IOS_APP_ID || vars.IOS_APP_ID }}
          SECRET_RELEASE_HUB_IOS_APP_ID: ${{ secrets.RELEASE_HUB_IOS_APP_ID || secrets.UPDATE_IOS_APP_ID || secrets.IOS_APP_ID }}
          VARS_HUB_API_KEY: ${{ vars.RELEASE_HUB_API_KEY }}
          SECRET_HUB_API_KEY: ${{ secrets.RELEASE_HUB_API_KEY }}
        run: |
          RELEASE_HUB_URL="$(echo "${VARS_RELEASE_HUB_URL:-$SECRET_RELEASE_HUB_URL}" | xargs)"
          RELEASE_HUB_APP_ID="$(echo "${VARS_RELEASE_HUB_IOS_APP_ID:-${SECRET_RELEASE_HUB_IOS_APP_ID:-tcm-admin-ios}}" | xargs)"
          RELEASE_HUB_API_KEY="$(echo "${VARS_HUB_API_KEY:-$SECRET_HUB_API_KEY}" | xargs)"

          echo "=== App Release Hub 自动同步检查 (iOS) ==="
          echo "Hub URL:    ${RELEASE_HUB_URL:-<未配置>}"
          echo "App ID:     ${RELEASE_HUB_APP_ID:-tcm-admin-ios}"
          if [ -n "$RELEASE_HUB_API_KEY" ]; then
            echo "API Key:    已配置 (${#RELEASE_HUB_API_KEY} 字符)"
          else
            echo "API Key:    <未配置>"
          fi

          MISSING=""
          [ -z "$RELEASE_HUB_URL" ] && MISSING="$MISSING RELEASE_HUB_URL/UPDATE_BASE_URL"
          [ -z "$RELEASE_HUB_APP_ID" ] && MISSING="$MISSING RELEASE_HUB_IOS_APP_ID"
          [ -z "$RELEASE_HUB_API_KEY" ] && MISSING="$MISSING RELEASE_HUB_API_KEY"

          if [ -n "$MISSING" ]; then
            echo "::warning::缺少以下配置，跳过自动通知 Release Hub 同步:$MISSING。请在仓库的 Settings -> Secrets and variables -> Actions 中进行设置。"
            exit 0
          fi

          SYNC_ENDPOINT="${RELEASE_HUB_URL%/}/admin/apps/${RELEASE_HUB_APP_ID}/sync"
          echo "正在请求: POST $SYNC_ENDPOINT ..."

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE=$(curl -s -S -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "$SYNC_ENDPOINT" \
            -H "X-API-Key: ${RELEASE_HUB_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 180 || echo "CURL_ERROR")

          RESPONSE_BODY=$(cat "$RESPONSE_FILE" 2>/dev/null || echo "")
          rm -f "$RESPONSE_FILE"

          echo "Hub 响应 (HTTP $HTTP_CODE): $RESPONSE_BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 成功通知 App Release Hub 同步最新 Release！"
          else
            echo "::warning::App Release Hub 同步失败 (HTTP $HTTP_CODE): $RESPONSE_BODY"
          fi

      - name: Clean up Keychain
        if: always()
        run: |
          if [ -n "${IOS_KEYCHAIN_PATH:-}" ] && [ -f "$IOS_KEYCHAIN_PATH" ]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
