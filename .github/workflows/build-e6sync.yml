name: Build E6Sync

on:
  push:
    branches: [main]
    paths:
      - E6Sync/**
      - .github/workflows/build-e6sync.yml
  pull_request:
    branches: [main]
    paths:
      - E6Sync/**
      - .github/workflows/build-e6sync.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: E6Sync-Server2008
            solution: E6Sync/E6Sync.sln
            output: E6Sync/bin/Release
            requires_net462: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET Framework 4.6.2 targeting pack
        if: matrix.requires_net462
        shell: pwsh
        run: |
          $targetingPack = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.2'
          if (-not (Test-Path $targetingPack)) {
            choco install netfx-4.6.2-devpack --yes --no-progress
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: msbuild '${{ matrix.solution }}' /restore /m /p:Configuration=Release /p:Platform='Any CPU'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish E6Sync Release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: E6Sync-Server2008
          path: package/E6Sync-Server2008

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          cd package
          zip -r "../E6Sync-Server2008-${{ inputs.release_tag }}.zip" E6Sync-Server2008

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: E6Sync ${{ inputs.release_tag }}
          generate_release_notes: true
          files: E6Sync-Server2008-${{ inputs.release_tag }}.zip
