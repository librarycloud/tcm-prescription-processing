name: Android Debug APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "后端 API 根地址，例如 https://api.example.com"
        required: false
        type: string

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/commandlinetools-linux-11076708.zip"
          mkdir -p "$sdk_root/cmdline-tools"
          for attempt in 1 2 3; do
            if curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 --output "$tools_zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" && unzip -tq "$tools_zip"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          unzip -q "$tools_zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$ANDROID_SDK_ROOT"
          yes | sdkmanager --sdk_root="$sdk_root" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if sdkmanager --sdk_root="$sdk_root" --install "platforms;android-36" "build-tools;36.0.0"; then
              exit 0
            fi
            rm -rf "$sdk_root/.temp" "$sdk_root/.downloadIntermediates"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL }}
        run: gradle --no-daemon assembleDebug -PAPI_BASE_URL="${API_BASE_URL:-http://10.0.2.2:3000}"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tcm-admin-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
