name: Android Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android versionName，例如 1.2.58"
        required: true
        type: string
      version_code:
        description: "可选，内部 versionCode 整数（不填则根据 versionName 自动换算，如 1.2.58 -> 10258）"
        required: false
        type: string
      release_tag:
        description: "可选，GitHub Release 标签，例如 v1.2.58；不填则使用 v+版本名称"
        required: false
        type: string
      api_base_url:
        description: "正式 API 根地址，例如 https://api.tcm.example.com"
        required: false
        type: string

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/commandlinetools-linux-11076708.zip"
          mkdir -p "$sdk_root/cmdline-tools"
          for attempt in 1 2 3; do
            if curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 --output "$tools_zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" && unzip -tq "$tools_zip"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          unzip -q "$tools_zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$ANDROID_SDK_ROOT"
          yes | sdkmanager --sdk_root="$sdk_root" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if sdkmanager --sdk_root="$sdk_root" --install "platforms;android-36" "build-tools;36.0.0"; then
              exit 0
            fi
            rm -rf "$sdk_root/.temp" "$sdk_root/.downloadIntermediates"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Build signed release APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          version_code="$VERSION_CODE_INPUT"
          version_name="$VERSION_NAME_INPUT"
          if [ -z "$version_name" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version_name" ]; then
            version_name="$(sed -n 's/.*\.orElse("\([^"]*\)").*/\1/p' app/build.gradle.kts | tail -n 1)"
          fi
          if [ -z "$version_code" ]; then
            if [[ "$version_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version_code=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
            elif [[ "$version_name" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
              version_code=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 ))
            else
              version_code="$(sed -n 's/.*\.orElse(\([0-9][0-9]*\)).*/\1/p' app/build.gradle.kts | tail -n 1 | tr -d '[:space:]')"
            fi
          fi
          case "$version_code" in
            ''|*[!0-9]*) echo "version_code must be a positive integer"; exit 1 ;;
          esac
          test "$version_code" -gt 0
          test -n "$version_name"
          gradle --no-daemon assembleRelease \
            -PAPI_BASE_URL="$API_BASE_URL" \
            -PVERSION_CODE="$version_code" \
            -PVERSION_NAME="$version_name"
          printf 'ANDROID_VERSION_CODE=%s\nANDROID_VERSION_NAME=%s\n' "$version_code" "$version_name" >> "$GITHUB_ENV"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: tcm-admin-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Create release metadata
        shell: bash
        run: |
          set -euo pipefail
          version_code="$ANDROID_VERSION_CODE"
          version_name="$ANDROID_VERSION_NAME"
          test -n "$version_code"
          test -n "$version_name"
          sha256="$(sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}')"
          size="$(stat -c '%s' app/build/outputs/apk/release/app-release.apk)"
          cat > app-version.android.json <<EOF
          {
            "versionCode": $version_code,
            "versionName": "$version_name",
            "minVersionCode": 1,
            "forceUpdate": false,
            "releaseNotes": [],
            "publishedAt": "$(date -u +%F)",
            "apkAsset": "app-release.apk",
            "sha256": "$sha256",
            "size": $size
          }
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version_name) || github.ref_name) }}
          name: 药房助手 ${{ inputs.release_tag || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version_name) || github.ref_name) }}
          generate_release_notes: true
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app-version.android.json
      - name: Remove signing keystore
        if: always()
        run: rm -f release.keystore
