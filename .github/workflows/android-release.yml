name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "正式 API 根地址，例如 https://api.tcm.example.com"
        required: false
        type: string

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/commandlinetools-linux-11076708.zip"
          mkdir -p "$sdk_root/cmdline-tools"
          for attempt in 1 2 3; do
            if curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 --output "$tools_zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" && unzip -tq "$tools_zip"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          unzip -q "$tools_zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$ANDROID_SDK_ROOT"
          yes | sdkmanager --sdk_root="$sdk_root" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if sdkmanager --sdk_root="$sdk_root" --install "platforms;android-36" "build-tools;36.0.0"; then
              exit 0
            fi
            rm -rf "$sdk_root/.temp" "$sdk_root/.downloadIntermediates"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Build signed release APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon assembleRelease -PAPI_BASE_URL="$API_BASE_URL"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: tcm-admin-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
      - name: Remove signing keystore
        if: always()
        run: rm -f release.keystore
