name: Android Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android versionName，例如 1.2.58"
        required: true
        type: string
      version_code:
        description: "可选，内部 versionCode 整数（不填则根据 versionName 自动换算，如 1.2.58 -> 10258）"
        required: false
        type: string
      release_tag:
        description: "可选，GitHub Release 标签，例如 v1.2.58；不填则使用 v+版本名称"
        required: false
        type: string
      api_base_url:
        description: "正式 API 根地址，例如 https://api.tcm.example.com"
        required: false
        type: string
      update_base_url:
        description: "可选，独立更新服务根地址（如 https://release.example.com，不填则优先使用环境变量或与 API 同服）"
        required: false
        type: string
      update_app_id:
        description: "可选，在更新服务中的 App ID（默认 android-main）"
        required: false
        default: "android-main"
        type: string

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/commandlinetools-linux-11076708.zip"
          mkdir -p "$sdk_root/cmdline-tools"
          for attempt in 1 2 3; do
            if curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 --output "$tools_zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" && unzip -tq "$tools_zip"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          unzip -q "$tools_zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$ANDROID_SDK_ROOT"
          yes | sdkmanager --sdk_root="$sdk_root" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if sdkmanager --sdk_root="$sdk_root" --install "platforms;android-36" "build-tools;36.0.0"; then
              exit 0
            fi
            rm -rf "$sdk_root/.temp" "$sdk_root/.downloadIntermediates"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Build signed release APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || secrets.API_BASE_URL }}
          UPDATE_BASE_URL: ${{ inputs.update_base_url || vars.UPDATE_BASE_URL || secrets.UPDATE_BASE_URL || '' }}
          UPDATE_APP_ID: ${{ inputs.update_app_id || vars.UPDATE_APP_ID || secrets.UPDATE_APP_ID || 'android-main' }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          version_code="$VERSION_CODE_INPUT"
          version_name="$VERSION_NAME_INPUT"
          if [ -z "$version_name" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version_name" ]; then
            version_name="$(sed -n 's/.*\.orElse("\([^"]*\)").*/\1/p' app/build.gradle.kts | tail -n 1)"
          fi
          if [ -z "$version_code" ]; then
            if [[ "$version_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version_code=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
            elif [[ "$version_name" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
              version_code=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 ))
            else
              version_code="$(sed -n 's/.*\.orElse(\([0-9][0-9]*\)).*/\1/p' app/build.gradle.kts | tail -n 1 | tr -d '[:space:]')"
            fi
          fi
          case "$version_code" in
            ''|*[!0-9]*) echo "version_code must be a positive integer"; exit 1 ;;
          esac
          test "$version_code" -gt 0
          test -n "$version_name"
          gradle_args=(
            --no-daemon assembleRelease
            -PAPI_BASE_URL="$API_BASE_URL"
            -PVERSION_CODE="$version_code"
            -PVERSION_NAME="$version_name"
          )
          if [ -n "$UPDATE_BASE_URL" ]; then
            gradle_args+=("-PUPDATE_BASE_URL=$UPDATE_BASE_URL")
          fi
          if [ -n "$UPDATE_APP_ID" ]; then
            gradle_args+=("-PUPDATE_APP_ID=$UPDATE_APP_ID")
          fi
          gradle "${gradle_args[@]}"
          printf 'ANDROID_VERSION_CODE=%s\nANDROID_VERSION_NAME=%s\n' "$version_code" "$version_name" >> "$GITHUB_ENV"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: tcm-admin-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Create release metadata
        shell: bash
        run: |
          set -euo pipefail
          version_code="$ANDROID_VERSION_CODE"
          version_name="$ANDROID_VERSION_NAME"
          test -n "$version_code"
          test -n "$version_name"
          sha256="$(sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}')"
          size="$(stat -c '%s' app/build/outputs/apk/release/app-release.apk)"
          prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            notes_json="$(git log "${prev_tag}..HEAD" --pretty=format:'%s' | grep -v -E '^(Merge|chore\(release\))' | head -n 15 | jq -R . | jq -s .)"
          else
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            notes_json="$(git log -n 10 --pretty=format:'%s' | grep -v -E '^(Merge|chore\(release\))' | jq -R . | jq -s .)"
          fi
          test -n "$notes_json" || notes_json="[]"
          cat > app-version.android.json <<EOF
          {
            "versionCode": $version_code,
            "versionName": "$version_name",
            "minVersionCode": 1,
            "forceUpdate": false,
            "releaseNotes": $notes_json,
            "changelogUrl": "$changelog_url",
            "publishedAt": "$(date -u +%F)",
            "apkAsset": "app-release.apk",
            "sha256": "$sha256",
            "size": $size
          }
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version_name) || github.ref_name) }}
          name: 药房助手 ${{ inputs.release_tag || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version_name) || github.ref_name) }}
          generate_release_notes: true
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app-version.android.json
      - name: Notify App Release Hub
        if: success()
        env:
          RELEASE_HUB_URL: ${{ inputs.update_base_url || vars.RELEASE_HUB_URL || secrets.RELEASE_HUB_URL || vars.UPDATE_BASE_URL || secrets.UPDATE_BASE_URL }}
          RELEASE_HUB_APP_ID: ${{ inputs.update_app_id || vars.RELEASE_HUB_APP_ID || secrets.RELEASE_HUB_APP_ID || vars.UPDATE_APP_ID || secrets.UPDATE_APP_ID || 'android-main' }}
          RELEASE_HUB_API_KEY: ${{ secrets.RELEASE_HUB_API_KEY }}
        run: |
          if [ -n "$RELEASE_HUB_URL" ] && [ -n "$RELEASE_HUB_API_KEY" ]; then
            echo "Notifying App Release Hub at $RELEASE_HUB_URL for app $RELEASE_HUB_APP_ID..."
            curl -s -S -X POST "${RELEASE_HUB_URL%/}/admin/apps/${RELEASE_HUB_APP_ID}/sync" \
              -H "X-API-Key: ${RELEASE_HUB_API_KEY}" \
              -H "Content-Type: application/json" \
              --max-time 30 || echo "::warning::Failed to notify App Release Hub, but release was published."
          else
            echo "RELEASE_HUB_URL or RELEASE_HUB_API_KEY not configured, skipping automatic sync notification."
          fi
      - name: Remove signing keystore
        if: always()
        run: rm -f release.keystore
